<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-labelledby="title description">
  <title id="title">AirGesture Studio logo</title>
  <desc id="description">A fingertip drawing a gesture trail inside a rounded dark square.</desc>
  <defs>
    <linearGradient id="surface" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1c2521"/>
      <stop offset="1" stop-color="#090d0b"/>
    </linearGradient>
    <linearGradient id="trail" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#39d353"/>
      <stop offset="1" stop-color="#8ce99a"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#000" flood-opacity=".35"/>
    </filter>
  </defs>

  <rect x="8" y="8" width="112" height="112" rx="28" fill="url(#surface)" filter="url(#shadow)"/>
  <rect x="9" y="9" width="110" height="110" rx="27" fill="none" stroke="#39463f" stroke-width="2"/>

  <path
    d="M24 86 C40 97 49 91 56 79 C63 67 66 53 71 38"
    fill="none"
    stroke="url(#trail)"
    stroke-width="7"
    stroke-linecap="round"
  />
  <path
    d="M57 80 C64 67 72 61 84 58 C94 55 101 50 106 43"
    fill="none"
    stroke="#f5f7f6"
    stroke-width="8"
    stroke-linecap="round"
  />
  <circle cx="106" cy="43" r="8" fill="#ef4444"/>
  <circle cx="106" cy="43" r="3" fill="#fff"/>
</svg>
